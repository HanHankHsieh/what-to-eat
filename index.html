        var boxH = 32;
        var boxW = Math.min(this.VW - 20, ctx.measureText(text).width + padX * 2);
        var boxX = Math.max(10, Math.min(this.VW - 10 - boxW, cx - boxW / 2));
        var boxY = slotTopY - boxH - 12;
        var r = 10;

        ctx.shadowColor = 'rgba(0,0,0,0.75)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.96)';
        ctx.strokeStyle = '#FDE047';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(boxX + r, boxY);
        ctx.lineTo(boxX + boxW - r, boxY);
        ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + r);
        ctx.lineTo(boxX + boxW, boxY + boxH - r);
        ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - r, boxY + boxH);
        ctx.lineTo(boxX + r, boxY + boxH);
        ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - r);
        ctx.lineTo(boxX, boxY + r);
        ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.stroke();

        var triX = Math.max(boxX + 12, Math.min(boxX + boxW - 12, cx));
        ctx.fillStyle = '#FDE047';
        ctx.beginPath();
        ctx.moveTo(triX - 6, boxY + boxH);
        ctx.lineTo(triX + 6, boxY + boxH);
        ctx.lineTo(triX, boxY + boxH + 7);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#FEF9C3';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, boxX + boxW / 2, boxY + boxH / 2 + 0.5);
        ctx.restore();
      };

      PlinkoEngine.prototype.draw = function () {
        var ctx = this.ctx;
        if (!ctx || this.canvas.width === 0 || this.canvas.height === 0) return;

        ctx.save();
        ctx.setTransform(this.canvas.width / this.VW, 0, 0, this.canvas.height / this.VH, 0, 0);

        // 1. 深藍街機背景與微妙網格
        var bg = ctx.createLinearGradient(0, 0, 0, this.VH);
        bg.addColorStop(0, '#0b1326');
        bg.addColorStop(0.55, '#091020');
        bg.addColorStop(1, '#060a14');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, this.VW, this.VH);

        // 2. 頂部投球區背景與虛線分隔
        ctx.fillStyle = 'rgba(34, 211, 238, 0.05)';
        ctx.fillRect(this.wallPad, 0, this.VW - this.wallPad * 2, this.dropZoneH);

        ctx.save();
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.28)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(this.wallPad, this.dropZoneH);
        ctx.lineTo(this.VW - this.wallPad, this.dropZoneH);
        ctx.stroke();
        ctx.restore();

        // 投球區瞄準光束與預覽彈珠
        if (!this.isDropping && this.slots.length > 0 && typeof this.aimX === 'number') {
          ctx.save();
          var beam = ctx.createLinearGradient(this.aimX, this.dropZoneH * 0.5, this.aimX, this.VH - this.slotH);
          beam.addColorStop(0, 'rgba(253, 224, 71, 0.45)');
          beam.addColorStop(1, 'rgba(253, 224, 71, 0.02)');
          ctx.strokeStyle = beam;
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(this.aimX, this.dropZoneH * 0.5);
          ctx.lineTo(this.aimX, this.VH - this.slotH);
          ctx.stroke();

          ctx.setLineDash([]);
          ctx.shadowColor = '#FDE047';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(this.aimX, this.dropZoneH * 0.52, this.ballR, 0, Math.PI * 2);
          ctx.fillStyle = '#FDE047';
          ctx.fill();
          ctx.restore();
        } else if (!this.isDropping && this.slots.length > 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(148, 163, 184, 0.65)';
          ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('▼ 點擊或拖曳此處自選落點 ▼', this.VW / 2, this.dropZoneH / 2);
          ctx.restore();
        }

        // 3. 左右側邊霓虹牆柱
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, this.wallPad, this.VH);
        ctx.fillRect(this.VW - this.wallPad, 0, this.wallPad, this.VH);
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.wallPad, 0);
        ctx.lineTo(this.wallPad, this.VH);
        ctx.moveTo(this.VW - this.wallPad, 0);
        ctx.lineTo(this.VW - this.wallPad, this.VH);
        ctx.stroke();

        // 4. 4 對左右斜角導流板
        var i;
        for (i = 0; i < this.deflectors.length; i++) {
          var df = this.deflectors[i];
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(df.pTop.x, df.pTop.y);
          ctx.lineTo(df.pTip.x, df.pTip.y);
          ctx.lineTo(df.pBot.x, df.pBot.y);
          ctx.closePath();
          ctx.fillStyle = df.glow > 0.1 ? 'rgba(253, 224, 71, 0.55)' : 'rgba(34, 211, 238, 0.24)';
          ctx.fill();
          ctx.strokeStyle = df.glow > 0.1 ? '#FEF08A' : '#22D3EE';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }

        // 5. 底部店家槽位與隔板
        var n = this.slots.length;
        var slotTopY = this.VH - this.slotH;
        if (n > 0) {
          var usableW = this.VW - this.wallPad * 2;
          var slotW = usableW / n;

          for (i = 0; i < n; i++) {
            var sx = this.wallPad + i * slotW;
            var col = SLOT_PALETTE[i % SLOT_PALETTE.length];
            var isWin = (i === this.winningIdx);
            var isHov = (i === this.hoveredSlotIdx);

            var grad = ctx.createLinearGradient(sx, slotTopY, sx, this.VH);
            grad.addColorStop(0, hexToRgba(col, isWin ? 0.88 : isHov ? 0.58 : 0.34));
            grad.addColorStop(1, hexToRgba(col, isWin ? 1.0 : isHov ? 0.82 : 0.62));
            ctx.fillStyle = grad;
            ctx.fillRect(sx, slotTopY, slotW, this.slotH);

            if (this.slotFlash > 0.01) {
              ctx.fillStyle = 'rgba(254, 240, 138, ' + (this.slotFlash * 0.48) + ')';
              ctx.fillRect(sx, slotTopY, slotW, this.slotH);
            }

            if (isHov && !isWin) {
              ctx.strokeStyle = 'rgba(254, 240, 138, 0.85)';
              ctx.lineWidth = 2;
              ctx.strokeRect(sx + 1, slotTopY + 1, slotW - 2, this.slotH - 2);
            }

            this.drawSlotLabel(ctx, this.slots[i].name, sx, slotTopY, slotW, this.slotH, isWin);
          }

          // 槽位隔板與圓頭門檻
          var divW = Math.max(2, this.divHalfW * 2);
          for (i = 0; i < this.dividers.length; i++) {
            var div = this.dividers[i];
            ctx.strokeStyle = '#CBD5E1';
            ctx.lineWidth = divW;
            ctx.beginPath();
            ctx.moveTo(div.x, div.topY);
            ctx.lineTo(div.x, div.botY);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(div.x, div.topY, this.divTipR, 0, Math.PI * 2);
            ctx.fillStyle = '#FBBF24';
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = Math.max(1, this.divTipR * 0.3);
            ctx.stroke();
          }

          // 中獎槽位脈動金色光暈
          if (this.winningIdx >= 0 && this.winningIdx < n) {
            var wi = this.winningIdx;
            var wx = this.wallPad + wi * slotW;
            var pulse = 0.5 + 0.5 * Math.sin(this.winPulse);
            var pad = 2 + pulse * 2.5;
            ctx.save();
            ctx.shadowColor = '#FDE047';
            ctx.shadowBlur = 18 + pulse * 14;
            ctx.fillStyle = 'rgba(254, 240, 138, ' + (0.18 + pulse * 0.16) + ')';
            ctx.fillRect(wx - pad * 0.5, slotTopY - pad, slotW + pad, this.slotH + pad);
            ctx.strokeStyle = '#FEF08A';
            ctx.lineWidth = 3;
            ctx.strokeRect(wx - pad * 0.5, slotTopY - pad, slotW + pad, this.slotH + pad);
            ctx.restore();
            this.drawSlotLabel(ctx, this.slots[wi].name, wx, slotTopY, slotW, this.slotH, true);
          }
        }

        // 6. 12 層交錯發光釘子
        for (i = 0; i < this.pegs.length; i++) {
          var peg = this.pegs[i];
          if (peg.ripple > 0) {
            ctx.beginPath();
            ctx.arc(peg.x, peg.y, this.pegR + peg.ripple * 18, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(253, 224, 71, ' + ((1 - peg.ripple) * 0.75) + ')';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
          var pg = ctx.createRadialGradient(peg.x - 1.5, peg.y - 1.5, 1, peg.x, peg.y, this.pegR);
          if (peg.glow > 0.15) {
            pg.addColorStop(0, '#FFFFFF');
            pg.addColorStop(0.5, '#FDE047');
            pg.addColorStop(1, '#F59E0B');
          } else {
            pg.addColorStop(0, '#E2E8F0');
            pg.addColorStop(0.55, '#94A3B8');
            pg.addColorStop(1, '#475569');
          }
          ctx.beginPath();
          ctx.arc(peg.x, peg.y, this.pegR, 0, Math.PI * 2);
          ctx.fillStyle = pg;
          ctx.fill();
        }

        // 7. 2 個旋轉小風車
        for (i = 0; i < this.spinners.length; i++) {
          var sp = this.spinners[i];
          ctx.save();
          ctx.translate(sp.x, sp.y);
          ctx.rotate(sp.angle);
          ctx.shadowColor = sp.color;
          ctx.shadowBlur = 10 + sp.glow * 14;
          ctx.strokeStyle = sp.glow > 0.2 ? '#FFFFFF' : sp.color;
          ctx.lineWidth = sp.halfW * 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-sp.armLen, 0);
          ctx.lineTo(sp.armLen, 0);
          ctx.moveTo(0, -sp.armLen);
          ctx.lineTo(0, sp.armLen);
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(0, 0, 6.4, 0, Math.PI * 2);
          ctx.fillStyle = '#F8FAFC';
          ctx.fill();
          ctx.strokeStyle = sp.color;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }

        // 8. 3 個霓虹強力彈跳蘑菇頭
        for (i = 0; i < this.bumpers.length; i++) {
          var bm = this.bumpers[i];
          var drawR = bm.r * bm.scale;
          if (bm.ripple > 0) {
            ctx.beginPath();
            ctx.arc(bm.x, bm.y, bm.r + bm.ripple * 34, 0, Math.PI * 2);
            ctx.strokeStyle = hexToRgba(bm.color, (1 - bm.ripple) * 0.88);
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          ctx.save();
          ctx.shadowColor = bm.color;
          ctx.shadowBlur = 14 + bm.glow * 16;
          var bgd = ctx.createRadialGradient(bm.x - 4, bm.y - 4, 2.5, bm.x, bm.y, drawR);
          bgd.addColorStop(0, bm.glow > 0.25 ? '#FFFFFF' : bm.core);
          bgd.addColorStop(0.55, bm.color);
          bgd.addColorStop(1, '#1E1B4B');

          ctx.beginPath();
          ctx.arc(bm.x, bm.y, drawR, 0, Math.PI * 2);
          ctx.fillStyle = bgd;
          ctx.fill();
          ctx.lineWidth = 2.4;
          ctx.strokeStyle = bm.glow > 0.2 ? '#FEF08A' : '#F8FAFC';
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('★', bm.x, bm.y + 1);
          ctx.restore();
        }

        // 9. 金色彗星拖尾與彈珠
        if (this.ball) {
          if (this.trail.length > 2) {
            for (i = 1; i < this.trail.length; i++) {
              var prev = this.trail[i - 1];
              var curr = this.trail[i];
              var ratio = i / this.trail.length;
              ctx.beginPath();
              ctx.moveTo(prev.x, prev.y);
              ctx.lineTo(curr.x, curr.y);
              ctx.strokeStyle = 'rgba(251, 191, 36, ' + (ratio * 0.65) + ')';
              ctx.lineWidth = this.ballR * 1.5 * ratio;
              ctx.lineCap = 'round';
              ctx.stroke();
            }
          }

          ctx.save();
          ctx.shadowColor = '#FBBF24';
          ctx.shadowBlur = 16;
          var blg = ctx.createRadialGradient(
            this.ball.x - 2.5, this.ball.y - 2.5, 1,
            this.ball.x, this.ball.y, this.ballR
          );
          blg.addColorStop(0, '#FFFBEB');
          blg.addColorStop(0.4, '#FDE047');
          blg.addColorStop(0.85, '#F59E0B');
          blg.addColorStop(1, '#B45309');

          ctx.beginPath();
          ctx.arc(this.ball.x, this.ball.y, this.ballR, 0, Math.PI * 2);
          ctx.fillStyle = blg;
          ctx.fill();
          ctx.restore();
        }

        // 10. 中獎彩帶粒子
        for (i = 0; i < this.confetti.length; i++) {
          var pt = this.confetti[i];
          ctx.save();
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);
          ctx.globalAlpha = Math.max(0, pt.life);
          ctx.fillStyle = pt.color;
          ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size * 0.6);
          ctx.restore();
        }

        // 11. 底部槽位即時完整店名 Tooltip
        if (this.hoveredSlotIdx >= 0 && this.hoveredSlotIdx < this.slots.length) {
          this.drawTooltip(ctx, this.hoveredSlotIdx);
        }

        ctx.restore();
      };

      PlinkoEngine.prototype.loop = function (ts) {
        if (!this.lastTs) this.lastTs = ts;
        var dt = Math.min(0.033, Math.max(0.001, (ts - this.lastTs) / 1000));
        this.lastTs = ts;

        this.update(dt);
        this.draw();

        var self = this;
        requestAnimationFrame(function (nextTs) {
          self.loop(nextTs);
        });
      };

      /* =====================================================================
       * 5. 應用程式狀態、DOM 參照與 UI 邏輯
       * ===================================================================== */
      var state = {
        restaurants: [],

      };

        toastStack: document.getElementById('toastStack')
      };

      /* ----- Toast 提示 ----- */
      function showToast(msg, type) {
        var div = document.createElement('div');
        div.className = 'toast-item toast-' + (type || 'info');
        div.textContent = msg;
        els.toastStack.appendChild(div);
        setTimeout(function () {
          div.style.opacity = '0';
          div.style.transition = 'opacity 0.25s ease';
          setTimeout(function () {
            if (div.parentNode) div.parentNode.removeChild(div);
          }, 260);
        }, 2400);
      }

      /* ----- 自訂確認彈窗 ----- */
      function openConfirm(title, message, okLabel, onConfirm) {
        els.confirmTitle.textContent = title;
        els.confirmMessage.textContent = message;
        els.confirmOkBtn.textContent = okLabel || '確認';
        state.pendingConfirm = onConfirm;
        els.confirmModal.classList.remove('hidden');
      }

      function closeConfirm() {
        els.confirmModal.classList.add('hidden');
        state.pendingConfirm = null;
      }

      /* ----- 持久化載入與儲存（v6 全新鍵值） ----- */
      function sanitizeList(arr) {
        return arr
          .filter(function (item) {
            return item && typeof item.name === 'string' && item.name.trim() !== '';
          })
          .map(function (item) {
            var name = item.name.trim();
            var timeVal = typeof item.time === 'string'
              ? item.time.trim()
              : (typeof item.estTime === 'string' ? item.estTime.trim() : '');
            var mapVal = typeof item.mapUrl === 'string' && item.mapUrl.trim()
              ? item.mapUrl.trim()
              : ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name));
            return {
              id: item.id || generateId(),
              name: name,
              transport: (item.transport || '步行').trim(),
              time: timeVal,
              note: typeof item.note === 'string' ? item.note.trim() : '',
              mapUrl: mapVal,
              isActive: item.isActive !== false
            };
          });
      }

      function saveRestaurants() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.restaurants));
        } catch (e) {
          showToast('瀏覽器儲存空間受限，變更僅保留於本次瀏覽', 'error');
        }
      }

      function loadInitialData() {
        try {
          var savedShuffle = localStorage.getItem(SHUFFLE_KEY);
          state.autoShuffle = savedShuffle === null ? true : savedShuffle !== 'false';
          els.autoShuffleCheck.checked = state.autoShuffle;
        } catch (e) {
          state.autoShuffle = true;
        }

        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw === null) {
            state.restaurants = buildDefaultRestaurants();
            saveRestaurants();
            return;
          }
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            state.restaurants = buildDefaultRestaurants();
            saveRestaurants();
            return;
          }
          state.restaurants = sanitizeList(parsed);
        } catch (e) {
          state.restaurants = buildDefaultRestaurants();
          saveRestaurants();
        }
      }

      /* ----- 取得所有交通方式與篩選後候選名單 ----- */
      function getAllTransports() {
        var list = BUILTIN_TRANSPORTS.slice();
        state.restaurants.forEach(function (r) {
          if (r.transport && list.indexOf(r.transport) === -1) {
            list.push(r.transport);
          }
        });
        return list;
      }

      function getFilteredCandidates() {
        return state.restaurants.filter(function (r) {
          if (!r.isActive) return false;
          if (state.selectedTransports.size === 0) return true;
          return state.selectedTransports.has(r.transport);
        });
      }

      /* ----- 初始化音效與彈珠台引擎 ----- */
      var soundEngine = new SoundEngine();

      function syncSoundUI() {
        els.soundIcon.textContent = soundEngine.enabled ? '🔊' : '🔇';
        els.soundText.textContent = soundEngine.enabled ? '音效' : '靜音';
        els.soundToggleBtn.classList.toggle('sound-on', soundEngine.enabled);
      }

      var plinko = new PlinkoEngine(els.plinkoCanvas, els.canvasStageWrapper, soundEngine, {
        onBeforeDrop: function () {
          if (state.autoShuffle && state.boardSlots.length > 1) {
            state.boardSlots = fisherYatesShuffle(state.boardSlots);
            plinko.setSlots(state.boardSlots, true);
          }
        },
        onStateChange: function () {
          syncControlButtons();
        },
        onResult: function (winner) {
          openResultModal(winner);
        }
      });

      function syncControlButtons() {
        var hasSlots = state.boardSlots.length > 0;
        var dropping = plinko.isDropping;
        els.dropBallBtn.disabled = !hasSlots || dropping;
        els.manualShuffleBtn.disabled = state.boardSlots.length < 2 || dropping;
        els.dropBallText.textContent = dropping ? '彈珠彈跳中...' : '投下彈珠！';
      }

      function syncBoardSlots(shuffleNow) {
        var candidates = getFilteredCandidates();
        els.candidateCount.textContent = '候選 ' + candidates.length + ' 家';

        if (candidates.length === 0) {
          state.boardSlots = [];
          plinko.setSlots([], false);
          els.emptyOverlay.classList.remove('hidden');
          syncControlButtons();
          return;
        }

        els.emptyOverlay.classList.add('hidden');
        var list = shuffleNow ? fisherYatesShuffle(candidates) : candidates.slice();
        state.boardSlots = list.slice(0, MAX_SLOTS);
        plinko.setSlots(state.boardSlots, shuffleNow);
        syncControlButtons();
      }

      /* ----- 渲染交通方式篩選列 ----- */
      function renderFilters() {
        var transports = getAllTransports();
        var isAll = state.selectedTransports.size === 0;
        var html = '<button type="button" class="chip-btn ' + (isAll ? 'all-active' : '') + '" data-transport="__all__">全部</button>';

        transports.forEach(function (t) {
          var meta = getTransportMeta(t);
          var active = state.selectedTransports.has(t);
          html += '<button type="button" class="chip-btn ' + (active ? 'active' : '') + '" data-transport="' + escapeHtml(t) + '">' +
            meta.icon + ' ' + escapeHtml(t) + '</button>';
        });
        els.filterChips.innerHTML = html;
      }

      /* ----- 渲染店家管理列表 ----- */
      function renderRestaurantList() {
        var total = state.restaurants.length;
        els.listTotalBadge.textContent = String(total);
        els.mobTabCount.textContent = String(total);

        var q = state.searchQuery.trim().toLowerCase();
        var filtered = state.restaurants.filter(function (r) {
          if (!q) return true;
          return (
            r.name.toLowerCase().indexOf(q) !== -1 ||
            r.transport.toLowerCase().indexOf(q) !== -1 ||
            (r.note && r.note.toLowerCase().indexOf(q) !== -1)
          );
        });

        if (filtered.length === 0) {
          els.restaurantList.innerHTML = '<div class="empty-list-msg">' +
            (total === 0 ? '目前沒有任何店家，請點上方「新增口袋店家」建立名單！' : '找不到符合搜尋條件的店家') +
            '</div>';
          return;
        }

        var html = filtered.map(function (r) {
          var meta = getTransportMeta(r.transport);
          var cardCls = r.isActive ? 'rest-card' : 'rest-card excluded';
          var timeHtml = r.time ? '<span class="time-chip">⏱️ ' + escapeHtml(r.time) + '</span>' : '';
          var noteHtml = r.note ? '<p class="rest-note">' + escapeHtml(r.note) + '</p>' : '';
          var mapBtn = r.mapUrl
            ? '<a class="act-btn" href="' + escapeHtml(r.mapUrl) + '" target="_blank" rel="noopener noreferrer" title="Google Maps 導航">🗺️</a>'
            : '';

          return (
            '<div class="' + cardCls + '">' +
              '<div class="rest-info">' +
                '<div class="rest-head">' +
                  '<span class="rest-name">' + escapeHtml(r.name) + '</span>' +
                  '<span class="t-badge ' + meta.cls + '">' + meta.icon + ' ' + escapeHtml(r.transport) + '</span>' +
                  timeHtml +
                '</div>' +
                noteHtml +
              '</div>' +
              '<div class="rest-actions">' +
                mapBtn +
                '<button type="button" class="active-toggle ' + (r.isActive ? 'on' : 'off') + '" data-action="toggle" data-id="' + escapeHtml(r.id) + '" title="' + (r.isActive ? '點擊暫時排除' : '點擊重新啟用') + '"><span></span></button>' +
                '<button type="button" class="act-btn" data-action="edit" data-id="' + escapeHtml(r.id) + '" title="編輯店家">✏️</button>' +
                '<button type="button" class="act-btn danger" data-action="delete" data-id="' + escapeHtml(r.id) + '" title="刪除店家">🗑️</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        els.restaurantList.innerHTML = html;
      }

      function renderAll(shuffleBoard) {
        renderFilters();
        renderRestaurantList();
        syncBoardSlots(Boolean(shuffleBoard));
      }

      /* ----- 折疊表單控制 ----- */
      function setFormOpen(open) {
        els.formCard.classList.toggle('open', open);
        els.restaurantForm.classList.toggle('hidden', !open);
        els.formToggleBtn.setAttribute('aria-expanded', String(open));
      }

      function resetForm(collapse) {
        els.editIdInput.value = '';
        els.nameInput.value = '';
        els.transportSelect.value = '步行';
        els.customTransportWrap.classList.add('hidden');
        els.customTransportInput.value = '';
        els.timeInput.value = '';
        els.noteInput.value = '';
        els.mapUrlInput.value = '';
        els.formHeaderTitle.textContent = '➕ 新增口袋店家';
        els.submitFormBtn.textContent = '新增店家';
        els.cancelEditBtn.classList.add('hidden');
        if (collapse) setFormOpen(false);
      }

      function startEdit(id) {
        var target = state.restaurants.find(function (r) { return r.id === id; });
        if (!target) return;

        els.editIdInput.value = target.id;
        els.nameInput.value = target.name;
        if (BUILTIN_TRANSPORTS.indexOf(target.transport) !== -1) {
          els.transportSelect.value = target.transport;
          els.customTransportWrap.classList.add('hidden');
          els.customTransportInput.value = '';
        } else {
          els.transportSelect.value = '__custom__';
          els.customTransportWrap.classList.remove('hidden');
          els.customTransportInput.value = target.transport;
        }
        els.timeInput.value = target.time || '';
        els.noteInput.value = target.note || '';
        els.mapUrlInput.value = target.mapUrl || '';

        els.formHeaderTitle.textContent = '✏️ 編輯店家：' + target.name;
        els.submitFormBtn.textContent = '儲存變更';
        els.cancelEditBtn.classList.remove('hidden');
        setFormOpen(true);
        els.nameInput.focus();
      }

      /* ----- 結果揭曉彈窗 ----- */
      function openResultModal(winner) {
        if (!winner) return;
        state.lastWinner = winner;
        els.resName.textContent = winner.name;

        var meta = getTransportMeta(winner.transport);
        els.resTransport.className = 't-badge ' + meta.cls;
        els.resTransport.textContent = meta.icon + ' ' + winner.transport;

        if (winner.time) {
          els.resTime.textContent = '⏱️ ' + winner.time;
          els.resTime.classList.remove('hidden');
        } else {
          els.resTime.classList.add('hidden');
        }

        if (winner.note) {
          els.resNote.textContent = winner.note;
          els.resNote.classList.remove('hidden');
        } else {
          els.resNote.classList.add('hidden');
        }

        if (winner.mapUrl) {
          els.resMapLink.href = winner.mapUrl;
          els.resMapLink.classList.remove('hidden');
        } else {
          els.resMapLink.classList.add('hidden');
        }

        els.resExcludeCheck.checked = false;
        els.resultModal.classList.remove('hidden');
      }

      function closeResultModal() {
        els.resultModal.classList.add('hidden');
      }

      /* ----- 手機雙分頁切換（切換回彈珠台時立即安全觸發 Resize） ----- */
      function switchMobileTab(tab) {
        els.appShell.setAttribute('data-tab', tab);
        els.mobTabBoard.classList.toggle('active', tab === 'board');
        els.mobTabList.classList.toggle('active', tab === 'list');
        if (tab === 'board') {
          requestAnimationFrame(function () {
            plinko.resize();
          });
        }
      }

      /* =====================================================================
       * 6. 綁定所有 UI 事件監聽
       * ===================================================================== */
      els.soundToggleBtn.addEventListener('click', function () {
        soundEngine.toggle();
        syncSoundUI();
        showToast(soundEngine.enabled ? '音效已開啟 🔊' : '已切換為靜音 🔇');
      });

      els.filterChips.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-transport]');
        if (!btn) return;
        var val = btn.getAttribute('data-transport');
        if (val === '__all__') {
          state.selectedTransports.clear();
        } else {
          if (state.selectedTransports.has(val)) {
            state.selectedTransports.delete(val);
          } else {
            state.selectedTransports.add(val);
          }
        }
        renderFilters();
        syncBoardSlots(false);
      });

      els.dropBallBtn.addEventListener('click', function () {
        plinko.dropBall();
      });

      els.autoShuffleCheck.addEventListener('change', function () {
        state.autoShuffle = els.autoShuffleCheck.checked;
        try {
          localStorage.setItem(SHUFFLE_KEY, String(state.autoShuffle));
        } catch (e) {}
        showToast(state.autoShuffle ? '已開啟：每次抽前自動洗牌 🎲' : '已關閉自動洗牌');
      });

      els.manualShuffleBtn.addEventListener('click', function () {
        if (plinko.isDropping || state.boardSlots.length < 2) return;
        state.boardSlots = fisherYatesShuffle(state.boardSlots);
        plinko.setSlots(state.boardSlots, true);
        soundEngine.playShuffle();
        showToast('已打亂底部店家順序 🔀');
      });

      els.formToggleBtn.addEventListener('click', function () {
        var isOpen = els.formCard.classList.contains('open');
        setFormOpen(!isOpen);
      });

      els.transportSelect.addEventListener('change', function () {
        var isCustom = els.transportSelect.value === '__custom__';
        els.customTransportWrap.classList.toggle('hidden', !isCustom);
        if (isCustom) els.customTransportInput.focus();
      });

      els.cancelEditBtn.addEventListener('click', function () {
        resetForm(true);
      });

      els.restaurantForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = els.nameInput.value.trim();
        if (!name) {
          showToast('請輸入店家名稱！', 'error');
          els.nameInput.focus();
          return;
        }

        var transport = els.transportSelect.value;
        if (transport === '__custom__') {
          transport = els.customTransportInput.value.trim();
          if (!transport) {
            showToast('請輸入自訂交通方式！', 'error');
            els.customTransportInput.focus();
            return;
          }
        }

        var time = els.timeInput.value.trim();
        var note = els.noteInput.value.trim();
        var mapUrl = els.mapUrlInput.value.trim() || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name));
        var editId = els.editIdInput.value;

        if (editId) {
          var target = state.restaurants.find(function (r) { return r.id === editId; });
          if (target) {
            target.name = name;
            target.transport = transport;
            target.time = time;
            target.note = note;
            target.mapUrl = mapUrl;
            showToast('已更新「' + name + '」', 'success');
          }
        } else {
          state.restaurants.unshift({
            id: generateId(),
            name: name,
            transport: transport,
            time: time,
            note: note,
            mapUrl: mapUrl,
            isActive: true
          });
          showToast('已新增「' + name + '」至口袋名單！', 'success');
        }

        saveRestaurants();
        resetForm(true);
        renderAll(false);
      });

      els.searchInput.addEventListener('input', function () {
        state.searchQuery = els.searchInput.value;
        renderRestaurantList();
      });

      els.restaurantList.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        var id = btn.getAttribute('data-id');
        var target = state.restaurants.find(function (r) { return r.id === id; });
        if (!target) return;

        if (action === 'toggle') {
          target.isActive = !target.isActive;
          saveRestaurants();
          renderAll(false);
          showToast(target.isActive ? '已啟用「' + target.name + '」' : '已暫時排除「' + target.name + '」');
        } else if (action === 'edit') {
          startEdit(id);
        } else if (action === 'delete') {
          openConfirm(
            '確認刪除店家',
            '確定要永久刪除「' + target.name + '」嗎？',
            '確認刪除',
            function () {
              state.restaurants = state.restaurants.filter(function (r) { return r.id !== id; });
              if (els.editIdInput.value === id) resetForm(true);
              saveRestaurants();
              renderAll(false);
              showToast('已刪除「' + target.name + '」');
            }
          );
        }
      });

      els.enableAllBtn.addEventListener('click', function () {
        state.restaurants.forEach(function (r) { r.isActive = true; });
        saveRestaurants();
        renderAll(false);
        showToast('已啟用所有口袋店家！', 'success');
      });

      els.resetDefaultsBtn.addEventListener('click', function () {
        openConfirm(
          '還原預設 23 家名單',
          '這會將名單重設為預設的 23 家步行美食口袋名單，確定要還原嗎？',
          '確認還原',
          function () {
            state.restaurants = buildDefaultRestaurants();
            state.selectedTransports.clear();
            state.searchQuery = '';
            els.searchInput.value = '';
            saveRestaurants();
            resetForm(true);
            renderAll(false);
            showToast('已還原 23 家預設口袋名單！', 'success');
          }
        );
      });

      els.mobTabBoard.addEventListener('click', function () { switchMobileTab('board'); });
      els.mobTabList.addEventListener('click', function () { switchMobileTab('list'); });

      els.resDecideBtn.addEventListener('click', function () {
        var name = state.lastWinner ? state.lastWinner.name : '';
        closeResultModal();
        showToast('就決定吃「' + name + '」啦！祝用餐愉快 🍽️', 'success');
      });

      els.resRedrawBtn.addEventListener('click', function () {
        if (els.resExcludeCheck.checked && state.lastWinner) {
          var target = state.restaurants.find(function (r) { return r.id === state.lastWinner.id; });
          if (target) {
            target.isActive = false;
            saveRestaurants();
            showToast('已暫時排除「' + target.name + '」');
          }
          renderAll(false);
        }
        closeResultModal();
        if (state.boardSlots.length > 0) {
          setTimeout(function () {
            plinko.dropBall();
          }, 160);
        } else {
          showToast('目前沒有其他候選店家，請調整篩選或啟用名單！', 'error');
        }
      });

      els.resultModal.addEventListener('click', function (e) {
        if (e.target === els.resultModal) closeResultModal();
      });

      els.confirmCancelBtn.addEventListener('click', closeConfirm);
      els.confirmOkBtn.addEventListener('click', function () {
        var fn = state.pendingConfirm;
        closeConfirm();
        if (typeof fn === 'function') fn();
      });
      els.confirmModal.addEventListener('click', function (e) {
        if (e.target === els.confirmModal) closeConfirm();
      });

      /* ----- JSON 匯出與匯入 ----- */
      els.exportBtn.addEventListener('click', function () {
        try {
          var payload = {
            version: 6,
            exportedAt: new Date().toISOString(),
            restaurants: state.restaurants
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'what-to-eat-restaurants.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('已匯出 JSON 備份檔 ⬇️', 'success');
        } catch (e) {
          showToast('匯出失敗，請稍後再試', 'error');
        }
      });

      els.importInput.addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          try {
            var parsed = JSON.parse(String(ev.target.result || ''));
            var list = Array.isArray(parsed) ? parsed : parsed.restaurants;
            if (!Array.isArray(list) || list.length === 0) {
              throw new Error('Invalid format');
            }
            state.restaurants = sanitizeList(list);
            state.selectedTransports.clear();
            state.searchQuery = '';
            els.searchInput.value = '';
            saveRestaurants();
            resetForm(true);
            renderAll(false);
            showToast('成功匯入 ' + state.restaurants.length + ' 家店家！', 'success');
          } catch (err) {
            showToast('匯入失敗：JSON 檔案格式不正確', 'error');
          } finally {
            els.importInput.value = '';
          }
        };
        reader.readAsText(file, 'utf-8');
      });

      /* =====================================================================
       * 7. 啟動初始化
       * ===================================================================== */
      loadInitialData();
      syncSoundUI();
      renderAll(false);
      requestAnimationFrame(function () {
        plinko.resize();
      });
    });
  </script>
</body>
</html>
